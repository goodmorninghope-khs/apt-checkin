<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>아파트 체크인 · AI 파트너즈 QR 출결 시연판</title>
<style>
:root{--bg:#0a0e1a;--panel:#111729;--panel2:#172038;--line:#243052;--tx:#e9edf8;--mut:#8f9abb;--a1:#7c5cff;--a2:#22d3ee;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185;--ex:#60a5fa;--grad:linear-gradient(135deg,#7c5cff 0%,#22d3ee 100%)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
body{min-height:100vh;background:radial-gradient(1200px 600px at 85% -10%,rgba(124,92,255,.18),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(34,211,238,.12),transparent 60%),var(--bg);background-attachment:fixed}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel2);padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;transition:.15s}
.btn:hover{border-color:#3a4a7a;background:#1d2747}
.btn.pri{background:var(--grad);border:0;color:#fff;box-shadow:0 8px 24px rgba(124,92,255,.35)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.on{border-color:var(--a2);color:var(--a2);background:rgba(34,211,238,.08)}
.btn.big{width:100%;justify-content:center;padding:16px;font-size:17px;border-radius:14px}
.linkbtn{background:none;border:0;color:var(--mut);text-decoration:underline;font-size:13px;padding:8px}
.mut{color:var(--mut)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:rgba(124,92,255,.16);color:#b9a9ff;border:1px solid rgba(124,92,255,.35)}
.tag.c{background:rgba(34,211,238,.1);color:#7fe6f5;border-color:rgba(34,211,238,.35)}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.panel{background:rgba(17,23,41,.82);border:1px solid var(--line);border-radius:18px;padding:18px 20px;backdrop-filter:blur(6px)}
.panel h3{margin:0 0 12px;font-size:14px;color:var(--mut);font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1f2a4d;border:1px solid #3a4a7a;padding:10px 18px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:99;font-size:14px}
#toast.show{opacity:1;transform:translateX(-50%)}
.logo{width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center;font-weight:900;color:#fff;font-size:18px;flex:none}

/* ---------- home ---------- */
.home{max-width:1080px;margin:0 auto;padding:40px 22px 60px}
.home .top{display:flex;align-items:center;gap:12px;margin-bottom:40px}
.home .top b{font-size:16px}.home .top small{display:block;color:var(--mut);font-size:12px}
.hero h1{font-size:clamp(30px,5vw,52px);line-height:1.18;margin:14px 0 14px;letter-spacing:-.02em}
.hero p{font-size:18px;color:#c3cbe3;max-width:720px;margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:34px 0}
.card{display:block;background:rgba(17,23,41,.85);border:1px solid var(--line);border-radius:18px;padding:20px;transition:.2s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-3px);border-color:#4b5fa0}
.card .n{font-size:12px;color:var(--a2);font-weight:800;letter-spacing:.08em}
.card h3{margin:6px 0 6px;font-size:19px}
.card p{margin:0;color:var(--mut);font-size:14px}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:10px 0 30px}
.flow div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14px;position:relative}
.flow div b{display:block;font-size:15px;margin-bottom:4px}
.flow div small{color:var(--mut)}
.flow div:not(:last-child)::after{content:"";position:absolute;right:-9px;top:50%;width:8px;height:2px;background:var(--a2)}
.note{font-size:13px;color:var(--mut);border-left:3px solid var(--a1);padding:6px 12px;background:rgba(124,92,255,.06);border-radius:0 8px 8px 0}
@media(max-width:820px){.flow{grid-template-columns:1fr}.flow div::after{display:none}}

/* ---------- screen ---------- */
.scr{display:grid;grid-template-columns:minmax(360px,42%) 1fr;gap:22px;padding:24px;min-height:100vh}
.qrside{display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:12px}
.brand b{font-size:18px}.brand small{display:block;color:var(--mut);font-size:13px}
.scr-title{font-size:clamp(30px,3.4vw,48px);margin:4px 0 0;letter-spacing:-.02em;line-height:1.15}
.scr-sub{margin:0;color:#c3cbe3;font-size:17px}
.qrwrap{background:rgba(17,23,41,.7);border:1px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;position:relative}
.qrbox{position:relative;padding:10px;border-radius:20px;background:var(--grad)}
.qrbox canvas{display:block;border-radius:12px;transition:opacity .25s}
.qrbox.swap canvas{opacity:.15}
.scanline{position:absolute;left:10px;right:10px;height:3px;background:linear-gradient(90deg,transparent,#22d3ee,transparent);top:10px;animation:scan 2.6s ease-in-out infinite;border-radius:3px;opacity:.85}
@keyframes scan{0%{top:12px}50%{top:calc(100% - 14px)}100%{top:12px}}
.cdbar{width:100%;height:6px;border-radius:6px;background:#1c2644;overflow:hidden}
.cdbar i{display:block;height:100%;background:var(--grad);width:100%}
.qrmeta{font-size:14px;color:var(--mut);text-align:center}
.qrmeta b{color:var(--tx)}
.question{background:linear-gradient(135deg,rgba(124,92,255,.16),rgba(34,211,238,.08));border:1px solid rgba(124,92,255,.35);border-radius:18px;padding:16px 18px}
.question small{color:#b9a9ff;font-weight:700;font-size:12px;letter-spacing:.06em}
.question b{display:block;font-size:21px;margin-top:4px;line-height:1.35}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrls select{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:13px}
.live{display:flex;flex-direction:column;gap:16px;min-width:0}
.kpis{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:14px}
.kpi{background:rgba(17,23,41,.82);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;justify-content:center}
.kpi small{color:var(--mut);font-size:13px;font-weight:600}
.kpi b{font-size:40px;line-height:1.1;letter-spacing:-.02em;white-space:nowrap}
.kpi b span{font-size:20px;color:var(--mut);font-weight:600}
.kpi.main{flex-direction:row;align-items:center;gap:16px}
.ring{width:110px;height:110px;flex:none}
.ring circle{fill:none;stroke-width:10}
.ring .bgc{stroke:#1c2644}.ring .fg{stroke:url(#rg);stroke-linecap:round;transition:stroke-dasharray .6s}
.ring text{fill:var(--tx);font-size:22px;font-weight:800}
.brief .say{font-size:20px;line-height:1.5;min-height:60px}
.brief .say::after{content:"▍";color:var(--a2);animation:blink 1s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.cbars{display:grid;gap:7px;margin-top:14px}
.cbar{display:grid;grid-template-columns:96px 1fr 30px;gap:10px;align-items:center;font-size:13px}
.cbar .t{height:10px;border-radius:6px;background:#1c2644;overflow:hidden}
.cbar .t i{display:block;height:100%;background:var(--grad);border-radius:6px;transition:width .6s}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:13px;padding:4px 10px;border-radius:999px;background:#1a2342;border:1px solid var(--line)}
.chip em{font-style:normal;color:var(--a2);font-weight:700;margin-left:4px}
button.chip:hover{border-color:var(--a2)}
.prevline{margin-top:12px;font-size:14px;color:#c3cbe3}
.grid2{display:grid;grid-template-columns:1fr 1.2fr;gap:16px;min-height:0;flex:1}.grid2 .panel{overflow:hidden}
.dong{display:grid;grid-template-columns:120px 1fr 48px;gap:10px;align-items:center;font-size:13px;margin-bottom:8px}
.dong .t{height:14px;border-radius:7px;background:#1c2644;overflow:hidden}
.dong .t i{display:block;height:100%;background:linear-gradient(90deg,#34d399,#22d3ee);transition:width .6s}
.dong.full span:first-child{color:var(--ok);font-weight:700}
.feed{display:flex;flex-direction:column;gap:8px}
.fi{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:#141c33;border:1px solid var(--line);animation:fin .5s ease}
@keyframes fin{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
.fi .av{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.fi b{font-size:14px}.fi small{color:var(--mut);font-size:12px;margin-left:6px}
.fi p{margin:2px 0 0;font-size:14px;color:#d3d9ec}
.fi .late{color:var(--warn);font-size:11px;margin-left:6px;font-weight:700}
.empty{color:var(--mut);font-size:14px;padding:10px 0}
@media(max-width:980px){.scr{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.kpi.main{grid-column:1/-1}}

/* ---------- mobile check-in ---------- */
.mob{max-width:460px;margin:0 auto;padding:16px 16px 30px;display:flex;flex-direction:column;gap:12px}
.mh{display:flex;align-items:center;gap:10px;padding:6px 2px 6px}
.mh b{font-size:15px}.mh small{display:block;color:var(--mut);font-size:12px}
.mcard{background:rgba(17,23,41,.9);border:1px solid var(--line);border-radius:18px;padding:16px}
.mcard h2{margin:2px 0 4px;font-size:22px;letter-spacing:-.01em}
.mcard small{color:var(--mut);font-size:12px;font-weight:600}
.mcard p{margin:4px 0 0}
.mcard label{font-weight:700;font-size:13px;color:#b9a9ff;letter-spacing:.04em}
.mcard .q{font-size:18px;font-weight:700;margin:4px 0 10px}
.mcard textarea,.mcard input[type=text],.mcard input[type=search]{width:100%;background:#0d1324;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;resize:none}
.mcard textarea:focus,.mcard input:focus{outline:2px solid rgba(34,211,238,.5);border-color:transparent}
.hello{background:linear-gradient(135deg,rgba(124,92,255,.22),rgba(34,211,238,.1));border-color:rgba(124,92,255,.4)}
.quote{font-size:16px;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.seg button{padding:10px;border-radius:10px;background:#0d1324;border:1px solid var(--line);font-weight:700;font-size:14px}
.seg button.sel{background:var(--grad);border-color:transparent;color:#fff}
.who-list{max-height:46vh;overflow:auto;margin-top:10px;display:flex;flex-direction:column;gap:12px}
.who-g small{display:block;margin-bottom:6px}
.who-g div{display:flex;flex-wrap:wrap;gap:6px}
.who{padding:9px 13px;border-radius:10px;background:#0d1324;border:1px solid var(--line);font-size:15px}
.who:hover{border-color:var(--a2)}
.confirm{margin-top:12px;padding:14px;border-radius:14px;background:#0d1324;border:1px solid var(--a2)}
.confirm .row{display:flex;gap:8px;margin-top:10px}
.confirm .row .btn{flex:1;justify-content:center}
.done{text-align:center;padding:26px 16px 10px}
.done h2{font-size:28px;margin:12px 0 4px}
.done p{margin:0;color:#c3cbe3}
.check{width:92px;height:92px;margin:0 auto;border-radius:50%;background:var(--grad);display:grid;place-items:center;box-shadow:0 0 0 10px rgba(124,92,255,.15),0 0 60px rgba(34,211,238,.35);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.check svg{width:46px;height:46px}
.check path{stroke:#fff;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.done.warn .check{background:linear-gradient(135deg,#f59e0b,#fb7185);box-shadow:0 0 0 10px rgba(251,113,133,.15)}
.done.warn .check b{font-size:44px;color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stats b{display:block;font-size:26px}
.ai{border-color:rgba(34,211,238,.4);background:linear-gradient(135deg,rgba(34,211,238,.1),rgba(124,92,255,.08))}
.ai p{font-size:16px}
.ticket{border-radius:20px;padding:20px;background:var(--grad);color:#fff;position:relative;overflow:hidden;box-shadow:0 12px 40px rgba(124,92,255,.35)}
.ticket::before,.ticket::after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:var(--bg);top:58%}
.ticket::before{left:-13px}.ticket::after{right:-13px}
.ticket small{font-weight:800;letter-spacing:.08em;opacity:.9;font-size:12px}
.ticket h3{font-size:24px;margin:8px 0 18px;line-height:1.3}
.ticket .row{display:flex;justify-content:space-between;border-top:2px dashed rgba(255,255,255,.5);padding-top:12px;font-weight:700;font-size:14px}
.ticket p{margin:10px 0 0;font-size:13px;opacity:.92}
.center{text-align:center}
.mf{text-align:center;color:#59648a;font-size:11px;margin-top:8px}

/* ---------- admin ---------- */
.adm{max-width:1280px;margin:0 auto;padding:18px 20px 60px}
.ah{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ah b{font-size:16px}.ah small{display:block;color:var(--mut);font-size:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:12px}
.spacer{flex:1}
.akpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.akpis .kpi b{font-size:30px}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:rgba(17,23,41,.85)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid #1d2745;text-align:center;white-space:nowrap}
th{position:sticky;top:0;background:#141c33;color:var(--mut);font-weight:700;font-size:12px}
td.l,th.l{text-align:left}
tr:hover td{background:rgba(124,92,255,.05)}
.cell{width:34px;height:30px;border-radius:8px;border:1px solid var(--line);background:#0f1527;font-weight:800;font-size:13px}
.st-present{color:var(--ok);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.08)}
.st-late{color:var(--warn);border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08)}
.st-absent{color:var(--bad);border-color:rgba(251,113,133,.4);background:rgba(251,113,133,.06)}
.st-excused{color:var(--ex);border-color:rgba(96,165,250,.4);background:rgba(96,165,250,.08)}
.st-none{color:#47527a}
.cell.ov{outline:2px dashed rgba(255,255,255,.25);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin:10px 2px 12px;align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.rate{font-weight:800}.rate.low{color:var(--bad)}.rate.ok{color:var(--ok)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.cols2{grid-template-columns:1fr}}
pre.out{white-space:pre-wrap;background:#0d1324;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13.5px;line-height:1.6;margin:0;max-height:420px;overflow:auto;font-family:inherit}
.care{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.care .panel p{margin:4px 0 10px}
.reason{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:rgba(251,113,133,.12);color:#fda4af;margin:0 6px 6px 0}
.reason.y{background:rgba(251,191,36,.12);color:#fcd34d}
.form{display:grid;gap:10px}
.form input,.form textarea,.form select{background:#0d1324;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:14px;width:100%}
.form label{font-size:12px;color:var(--mut);font-weight:700}
.stbl input{background:#0d1324;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:13px;width:100%}
.stbl td{padding:6px}
.mlist{display:flex;flex-direction:column;gap:8px}
.mlist div{padding:10px 12px;background:#141c33;border:1px solid var(--line);border-radius:10px;font-size:14px}
.mlist small{color:var(--mut)}

/* ---------- guide ---------- */
.guide{max-width:960px;margin:0 auto;padding:30px 22px 70px}
.guide h1{font-size:34px;margin:16px 0 8px;letter-spacing:-.02em}
.guide h2{font-size:22px;margin:40px 0 12px;display:flex;gap:10px;align-items:center}
.guide h2 i{font-style:normal;font-size:13px;color:var(--a2);border:1px solid rgba(34,211,238,.4);border-radius:8px;padding:2px 8px}
.guide p,.guide li{color:#cdd4ea;font-size:15.5px}
.guide table{font-size:14px;margin-top:6px}
.guide td,.guide th{white-space:normal;text-align:left;vertical-align:top;padding:10px 12px}
.opt{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.opt .panel h4{margin:6px 0 6px;font-size:17px}
.opt .panel p{font-size:14px;margin:0 0 8px}
.opt .panel ul{margin:0;padding-left:18px}
.opt .panel li{font-size:13.5px}
.rec{border-color:var(--a2)!important;box-shadow:0 0 0 1px rgba(34,211,238,.35)}
.chk li{margin-bottom:6px}
.src a{color:#7fe6f5;text-decoration:underline}
</style>
</head>

var qrcode = function() {

  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {

          for (var col = 0; col < moduleCount; col += 1) {

        }

      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();

      if (_typeNumber >= 7) {

      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

function memberStats(mid){const done=ordered().filter(s=>sessionDone(s.id));const st=done.map(s=>statusOf(s.id,mid));const att=st.filter(x=>x==='present'||x==='late'||x==='excused').length;return{done:done.length,att,rate:done.length?Math.round(att/done.length*100):null,st,doneSessions:done,missions:DB.checkins.filter(c=>c.mid===mid&&c.mode==='out'&&c.todo).length}}
function prevMission(mid,sid){const s=getS(sid);const before=ordered().filter(x=>x.no<s.no).map(x=>x.id);const outs=DB.checkins.filter(c=>c.mid===mid&&c.mode==='out'&&c.todo&&before.includes(c.sid)).sort((a,b)=>getS(b.sid).no-getS(a.sid).no);return outs[0]?{todo:outs[0].todo,sno:getS(outs[0].sid).no}:null}
function classify(t){return CATS.filter(c=>c.keys.some(k=>t.includes(k)))}
const STOP=new Set(['것','일','수','좀','내','제','더','잘','번','1번','2번','한','하나','보기','해','AI','ai','같이','이번','오늘','주','만들어','맡기기','써','쓰기','해보기','보고','가장','요즘','하기','다듬기','찾아보기','만들기','주간','싶어요','빠르게','1개','2개','1명']);
function tokens(t){return t.split(/[\s,.!?·…'"“”‘’()\/]+/).map(w=>w.replace(/(으로|에서|에게|까지|부터|하기|하고|해서|하는|해요|은|는|이|가|을|를|에|로|와|과|도|만|의)$/,'')).filter(w=>w.length>=2&&!STOP.has(w))}
function analyze(texts){const cats={},words={};texts.forEach(t=>{classify(t).forEach(c=>cats[c.name]=(cats[c.name]||0)+1);new Set(tokens(t)).forEach(w=>words[w]=(words[w]||0)+1)});return{n:texts.length,catArr:Object.entries(cats).sort((a,b)=>b[1]-a[1]),top:Object.entries(words).filter(x=>x[1]>=1).sort((a,b)=>b[1]-a[1]).slice(0,7)}}
function prevStats(ins){const p={done:0,half:0,not:0};ins.forEach(c=>{if(c.prev)p[c.prev]++});return p}
function briefText(a,mode,p){

  const c1=a.catArr[0],c2=a.catArr[1];
  if(mode==='in'){
    let t=`지금까지 ${a.n}명이 답했어요. `;
    if(c1)t+=`'${c1[0]}' 이야기가 가장 많고(${c1[1]}명)`+(c2?`, 다음은 '${c2[0]}'(${c2[1]}명)이에요. `:'. ');
    if(c1)t+=`오늘 실습은 '${c1[0]}' 사례로 열어 보면 좋겠어요.`;
    const tot=p.done+p.half+p.not;if(tot)t+=` 지난 미션은 ${tot}명 중 ${p.done}명이 해냈어요.`;
    return t;
  }
  let t=`${a.n}명이 7일 미션을 정했어요. `;
  if(c1)t+=`'${c1[0]}' 미션이 가장 많아요(${c1[1]}명). 다음 회차 첫 10분은 '${c1[0]}' 실천 후기로 시작해 보세요.`;
  return t;
}
function typeText(el,text){if(!el)return;if(el.dataset.full===text)return;el.dataset.full=text;clearInterval(el._ti);let i=0;el.textContent='';el._ti=setInterval(()=>{i+=2;el.textContent=text.slice(0,i);if(i>=text.length)clearInterval(el._ti)},28)}

function drawQR(cv,text,px){const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),m=2;const cell=Math.max(2,Math.floor(px/(n+m*2)));const size=cell*(n+m*2);const dpr=window.devicePixelRatio||1;cv.width=size*dpr;cv.height=size*dpr;cv.style.width=size+'px';cv.style.height=size+'px';const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.fillStyle='#fff';c.fillRect(0,0,size,size);c.fillStyle='#0a0e1a';for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))c.fillRect((k+m)*cell,(r+m)*cell,cell,cell)}

    if(abs>allow)rs.push(['r',`결석 ${abs}회 · 수료선(${DB.program.passPct}%) 미달 위험`]);else if(abs===allow&&tail>=1&&allow>0)rs.push(['y',`남은 결석 여유 0회`]);
    const nots=DB.checkins.filter(c=>c.mid===m.id&&c.prev==='not').length;if(nots>=2)rs.push(['y',`미션 "아직이요" ${nots}회`]);
    if(rs.length)out.push({m,x,rs,score:rs.filter(r=>r[0]==='r').length*2+rs.length})});

  const nx=os.find(s=>!sessionDone(s.id));

    return `${o.m.name}님, 아파트 운영진이에요. ${lastAbs?`${lastAbs.no}회차에 자리가 비어 있어 `:''}안부 여쭤요. 바쁜 일이 있으셨죠? 지난 회차 자료와 7일 미션 예시를 보내 드릴게요. ${nx?`다음 회차 ${fmtDate(nx.date)} ${nx.start}에 `:'다음에 '}꼭 같이해요. 혹시 공가 사유가 있으면 알려 주세요.`};
  $('#am').innerHTML=`<p class="note" style="margin-bottom:16px">벌점이 아니라 안부입니다. 출결 기록이 "누가 빠졌나"를 찾아 주면, 운영진은 사람의 말로 먼저 연락합니다. 아래 문장은 초안이니 고쳐서 보내세요.</p>
  ${out.length?`<div class="care">${out.map((o,i)=>`<div class="panel"><h3 style="color:var(--tx);font-size:16px">${esc(o.m.name)} <span class="mut" style="font-weight:500;font-size:13px">${esc(o.m.dept)} · ${dongHo(o.m)} · 출석률 ${o.x.rate}%</span></h3>${o.rs.map(r=>`<span class="reason ${r[0]==='y'?'y':''}">${r[1]}</span>`).join('')}<pre class="out" style="margin-top:6px">${esc(msg(o))}</pre><div style="margin-top:10px;display:flex;gap:8px"><button class="btn sm" data-i="${i}">안부 문장 복사</button></div></div>`).join('')}</div>`:`<div class="panel"><div class="empty">챙길 사람이 없어요. 진행된 회차가 없거나 모두 잘 나오고 있어요.<br>시연하려면 설정에서 "1~3회차 진행된 것처럼 만들기"를 눌러 보세요.</div></div>`}`;
  $$('[data-i]').forEach(b=>b.onclick=()=>copy(msg(out[+b.dataset.i])));

function makeDemo(){
  const r=mulberry32(20261105);const rp=a=>a[Math.floor(r()*a.length)];
  DB.checkins=[];DB.overrides={};
  const done=ordered().slice(0,3);
  done.forEach((s,si)=>{DB.members.forEach((m,mi)=>{
    let p=.9;if(mi===6)p=si===0?1:0;if(mi===13)p=si===1?0:1;if(mi===20)p=si===2?0:.9;
    if(r()<p){const base=new Date(s.date+'T'+s.start+':00').getTime();const lt=r()<.12;const ts=base+(lt?(12+r()*15):(-12+r()*13))*60000;
      const rec={id:uid(),sid:s.id,mid:m.id,mode:'in',ts,late:isLate(s,ts)};if(r()<.9)rec.text=rp(IN_POOL);
      if(si>0&&prevMission(m.id,s.id))rec.prev=mi===9?'not':rp(['done','done','done','half','not']);
      DB.checkins.push(rec);
      if(r()<.92){const e=new Date(s.date+'T'+s.end+':00').getTime()-r()*8*60000;DB.checkins.push({id:uid(),sid:s.id,mid:m.id,mode:'out',ts:e,take:rp(TAKE_POOL),todo:rp(TODO_POOL)})}}
  })});
  DB.overrides[done[1].id+'|'+DB.members[15].id]='excused';
  DB.demo=true;save();
}
